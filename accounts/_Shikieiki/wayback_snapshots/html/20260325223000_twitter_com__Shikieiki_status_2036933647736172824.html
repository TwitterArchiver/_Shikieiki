  萦绕着的警示念头时刻提醒着她:“切勿轻言生命之终焉。”
  <br/>
  但于她而言，这条生命又能是什么呢？也许是这残破不堪的身体与空洞洞的心灵糅合而成的畸变体罢了。
  <br/>
  失去姓名，失去了所有的她已经不局再拘泥于怨恨自身的深渊了。在普世条框下背负了无穷罪恶的她，那颗震颤的心脏也已经失去了所有的色彩。
