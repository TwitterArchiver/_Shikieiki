  凌晨、早晨、中午、傍晚，无论何时经历醒来又进入浅睡的我们总是会进入梦境，通常是即将发生的事情之梦，也即未发生的事物之梦。我们会起来，去刷牙、洗脸、整理物品然后开始做正事，但却都是梦。在梦中意识到之后就会成为旁观者，抑或是醒来。但是谁又能确定我们是否真的清醒呢？此番梦境也太过真实？
