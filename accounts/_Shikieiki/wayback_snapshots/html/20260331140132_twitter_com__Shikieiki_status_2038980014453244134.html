  她不会忘记，绝对不会，也只有她会这样做。所有难过、绝望、充满了痛苦与悔恨的时光全部是她所经历、替我们承担的。

  故我们终究成为了一体，回归了一体。但是我们的迟钝使得我们现在才发现她苏醒的真正原因，正是藏匿无意识中，刚冒出头的压力。
